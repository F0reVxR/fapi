<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="../static/login.css">
</head>

<body>
    <div class="container">
        <form method="post" action="/login">
            <label>Имя: <input type="text" name="username" value="{{ username }}" required></label>

            <label>Пароль: <input type="password" name="password" value="{{ password }}" required></label>

            <button type="submit">Войти</button>
            
            {% if error %}
            <label style="color: red;">{{ error }}</label>
            {% endif %}

        </form>
        <form action="/verify" method="post">
            <div>
                <!-- Сама картинка капчи -->
                <img id="captcha-img" src="/captcha" alt="Капча" style="vertical-align: middle; cursor: pointer;" onclick="reloadCaptcha()" title="Нажмите, чтобы обновить">
                <button type="button" onclick="reloadCaptcha()">🔄 Обновить</button>
            </div>

            <div style="margin-top: 10px;">
                <input type="text" name="user_captcha" placeholder="Введите символы" required>
                <button type="submit">Отправить</button>
            </div>
        </form>

        <script>
            function reloadCaptcha() {
                const img = document.getElementById('captcha-img');
                // Добавляем timestamp, чтобы браузер не брал старую картинку из кэша
                img.src = '/captcha?t=' + Date.now();
            }
        </script>
    </div>
</body>

</html>

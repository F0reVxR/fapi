<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добавить новость</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">NEWS.PORTAL</a>
      <a href="index.html" class="btn btn--outline">Отмена</a>
    </div>
  </header>

  <main class="container">
    <div class="form-card">
      <h1>Новая публикация</h1>
      
      <!-- enctype="multipart/form-data" обязателен для отправки файлов -->
      <form action="/news/create" method="POST" enctype="multipart/form-data">
        
        <div class="form-group">
          <label for="title">Заголовок новости</label>
          <input type="text" id="title" name="title" class="form-control" placeholder="Введите заголовок..." required>
        </div>

        <div class="form-group">
          <label for="annotation">Аннотация (краткое описание для плитки)</label>
          <textarea id="annotation" name="annotation" class="form-control" rows="3" placeholder="О чем эта новость в двух предложениях..." required></textarea>
        </div>

        <div class="form-group">
          <label for="published_at">Дата и время публикации</label>
          <input type="datetime-local" id="published_at" name="published_at" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="preview_image">Превью-картинка (обложка)</label>
          <input type="file" id="preview_image" name="preview_image" class="form-control" accept="image/*" required>
        </div>

        <div class="form-group">
          <label for="body">Текст статьи</label>
          <textarea id="body" name="body" class="form-control" rows="10" placeholder="Полный текст новости..." required></textarea>
        </div>

        <div class="form-group">
          <label for="article_images">Дополнительные картинки в статье</label>
          <input type="file" id="article_images" name="article_images" class="form-control" accept="image/*" multiple>
          <span class="form-hint">Можно выбрать сразу несколько изображений (Ctrl / Cmd + клик).</span>
        </div>

        <button type="submit" class="btn">Опубликовать новость</button>
      </form>
    </div>
  </main>

</body>
</html>

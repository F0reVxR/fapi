<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="../static/style.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <form method="post" enctype="multipart/form-data">
    <!-- Добавлен параметр ?v=... или обработка кэша, если фото обновляется -->
            <img id="avatarPreview" 
                src="/static/pics/{{ username }}/avatars/avatar.webp" 
                onerror="this.onerror=null; this.src='/static/pics/default-avatar.webp';"
                alt="Аватар">
                
            <input type="file" name="file" accept="image/jpeg, image/png, image/webp" required>
            <button type="submit">Отправить</button>
        </form>

        <label>Добро пожаловать, {{ username }}!</label>
        <!-- <label>Пароль: {{ password }}</label> -->
        <button id="toggle">Сменить тему</button>
        <form method="post" action="/logout"><button id="logout">Выйти</button></form>
    </div>
    <script src="../static/home_script.js"></script>
</body>

</html>
